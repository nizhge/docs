name: GTMBE Threads Daily Research (draft-only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gtmbe-threads-skills/config/research_sources.json'
      - 'gtmbe-threads-skills/scripts/engine.py'
      - 'gtmbe-threads-skills/scripts/run_daily.py'
      - '.github/workflows/gtmbe-threads-research.yml'
  schedule:
    # 08:23 Moscow, UTC+3 year-round.
    - cron: '23 5 * * *'
jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore small dedupe state cache
        uses: actions/cache/restore@v4
        with:
          path: gtmbe-threads-skills/local-state
          key: gtmbe-threads-state-${{ github.run_id }}
          restore-keys: |
            gtmbe-threads-state-
      - name: Collect selected public Telegram posts and prepare review-only artifacts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          # Owner previously identified @gtmbe as their author channel, distinct from personal @geni_al.
          # Public Telegram preview might still be inaccessible; failure is logged, not treated as success.
          GTMBE_OWNER_TELEGRAM_URL: https://t.me/s/gtmbe
          GTMBE_OWNER_TELEGRAM_CONFIRMED: '1'
        run: |
          python gtmbe-threads-skills/scripts/run_daily.py --out /tmp/gtmbe-threads-daily --state gtmbe-threads-skills/local-state/drafted.json
      - name: Save non-sensitive dedupe state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: gtmbe-threads-skills/local-state
          key: gtmbe-threads-state-${{ github.run_id }}
      - name: Upload research briefs and review-required drafts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtmbe-threads-draft-only-${{ github.run_id }}
          path: /tmp/gtmbe-threads-daily/
          if-no-files-found: warn
          retention-days: 14
